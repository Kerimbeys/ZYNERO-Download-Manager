[package]
name = "zynero"
version = "0.1.0"
description = "ZYNERO — Download. Faster. Smarter."
authors = ["KerimBeys"]
license = ""
repository = "https://github.com/Kerimbeys/ZYNERO-Download-Manager"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zynero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
percent-encoding = "2.3"
